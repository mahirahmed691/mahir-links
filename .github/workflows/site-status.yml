# Hourly uptime probes. A down site is written into the feed; it does not fail the job.
# This private repo cannot enable GitHub Pages, so the feed is kept as an Actions artifact.
# Job names and the concurrency group are distinct from CI, Deploy, and Monitor.
name: Site status

on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:
  push:
    paths:
      - "site-status/**"
      - ".github/workflows/site-status.yml"
  pull_request:
    paths:
      - "site-status/**"
      - ".github/workflows/site-status.yml"

permissions:
  contents: read

concurrency:
  group: site-status
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: site-status
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 20

      - name: Test
        working-directory: site-status
        run: npm test

      - name: Probe sites and write the feed
        if: github.event_name != 'pull_request'
        working-directory: site-status
        run: npm run check

      - name: Upload feed
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/upload-artifact@v7
        with:
          name: site-status-feed
          path: site-status/public
          retention-days: 7
